<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ปรับปรุงข้อมูลศิษย์เก่ารามาธิบดี</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- LIFF SDK -->
    <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap');
        body { font-family: 'Prompt', sans-serif; background-color: #f3f4f6; }
        .spinner { border: 4px solid rgba(0, 0, 0, 0.1); width: 36px; height: 36px; border-radius: 50%; border-left-color: #3b82f6; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        /* ซ่อนลูกศรเพิ่ม/ลดตัวเลขในช่อง input type="number" */
        input[type="number"]::-webkit-inner-spin-button,
        input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        input[type="number"] { -moz-appearance: textfield; }
    </style>
</head>
<body class="text-gray-800 antialiased p-4 md:p-8 flex justify-center">

    <div class="w-full max-w-lg bg-white rounded-2xl shadow-lg overflow-hidden">
        <!-- Header -->
        <div class="bg-blue-600 text-white p-6 text-center">
            <h1 class="text-xl font-semibold">ปรับปรุงข้อมูลศิษย์เก่ารามาธิบดี</h1>
            <p class="text-sm mt-1 text-blue-100" id="user-greeting">กำลังเตรียมความพร้อม...</p>
        </div>

        <div class="p-6 relative">
            
            <!-- Loading Overlay -->
            <div id="loading" class="hidden absolute inset-0 bg-white/80 z-50 flex flex-col items-center justify-center rounded-b-2xl">
                <div class="spinner mb-4"></div>
                <p class="text-sm font-medium text-gray-600" id="loading-text">กำลังประมวลผล...</p>
            </div>

            <!-- หน้าที่ 1: ฟอร์มค้นหา -->
            <div id="search-section">
                <form id="search-form" class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">รุ่น (Class)</label>
                        <!-- เปลี่ยนเป็น type="text" เพื่อรองรับตัวอักษร เช่น D6 หรือตัวเลขล้วน -->
                        <input type="text" id="s_class" required placeholder="เลขรุ่นหรือ D แพทย์ประจำบ้าน, 00 อาจารย์" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">ชื่อ (ไม่ระบุคำนำหน้า)</label>
                        <input type="text" id="s_fname" minlength="2" required placeholder="พิมพ์อย่างน้อย 2 ตัวอักษร" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition">
                        <p class="text-xs text-gray-500 mt-1">พิมพ์ชื่อให้ตรงอย่างน้อย 2 ตัวอักษรขึ้นไป</p>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">นามสกุล</label>
                        <input type="text" id="s_lname" minlength="2" required placeholder="พิมพ์อย่างน้อย 2 ตัวอักษร" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition">
                    </div>
                    
                    <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-3 rounded-lg transition mt-4 shadow-md">
                        ค้นหาข้อมูล
                    </button>
                </form>
            </div>

            <!-- หน้าที่ 1.5: แสดงรายการให้เลือก (กรณีพบหลายคน) -->
            <div id="select-section" class="hidden space-y-4">
                <h2 class="text-lg font-bold text-gray-800 text-center mb-4">พบข้อมูลมากกว่า 1 รายการ<br><span class="text-sm font-normal text-gray-500">กรุณาเลือกรายชื่อที่ต้องการแก้ไข</span></h2>
                <div id="user-list" class="space-y-3 max-h-80 overflow-y-auto pr-2">
                    <!-- รายชื่อจะถูกเติมที่นี่จาก JavaScript -->
                </div>
                <button type="button" onclick="cancelSelect()" class="w-full bg-gray-200 hover:bg-gray-300 text-gray-700 font-medium py-3 rounded-lg transition mt-4">
                    กลับไปค้นหาใหม่
                </button>
            </div>

            <!-- หน้าที่ 2: ฟอร์มแก้ไขข้อมูล -->
            <div id="edit-section" class="hidden space-y-5">
                
                <div class="flex flex-col items-center mb-6">
                    <div class="w-32 h-32 rounded-full border-4 border-gray-100 shadow-md overflow-hidden bg-gray-50 flex items-center justify-center mb-3">
                        <img id="profile-img" src="" alt="Profile Picture" class="w-full h-full object-cover hidden">
                        <svg id="profile-placeholder" class="w-16 h-16 text-gray-300" fill="currentColor" viewBox="0 0 24 24"><path d="M24 20.993V24H0v-2.996A14.977 14.977 0 0112.004 15c4.904 0 9.26 2.354 11.996 5.993zM16.002 8.999a4 4 0 11-8 0 4 4 0 018 0z" /></svg>
                    </div>
                    <h2 id="display-fullname" class="text-lg font-bold text-gray-800 text-center"></h2>
                </div>

                <form id="update-form" class="space-y-4">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-medium text-gray-500 mb-1">ชื่อใหม่ (ถ้ามี)</label>
                            <input type="text" id="e_name" class="w-full px-3 py-2 border border-gray-300 rounded-md text-sm outline-none focus:border-blue-500">
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-gray-500 mb-1">ชื่อภาษาอังกฤษ</label>
                            <input type="text" id="e_nameeng" class="w-full px-3 py-2 border border-gray-300 rounded-md text-sm outline-none focus:border-blue-500">
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-gray-500 mb-1">เลข ว. (idmd)</label>
                            <input type="text" id="e_idmd" class="w-full px-3 py-2 border border-gray-300 rounded-md text-sm outline-none focus:border-blue-500">
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-gray-500 mb-1">HN รามาธิบดี</label>
                            <input type="text" id="e_hn" class="w-full px-3 py-2 border border-gray-300 rounded-md text-sm outline-none focus:border-blue-500">
                        </div>
                        <div class="md:col-span-2">
                            <label class="block text-xs font-medium text-gray-500 mb-1">ที่ทำงาน</label>
                            <textarea id="e_offadd" rows="2" class="w-full px-3 py-2 border border-gray-300 rounded-md text-sm outline-none focus:border-blue-500"></textarea>
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-gray-500 mb-1">เบอร์ที่ทำงาน</label>
                            <input type="tel" id="e_offtel" class="w-full px-3 py-2 border border-gray-300 rounded-md text-sm outline-none focus:border-blue-500">
                        </div>
                        <div class="md:col-span-2">
                            <label class="block text-xs font-medium text-gray-500 mb-1">ที่อยู่บ้าน</label>
                            <textarea id="e_homeadd" rows="2" class="w-full px-3 py-2 border border-gray-300 rounded-md text-sm outline-none focus:border-blue-500"></textarea>
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-gray-500 mb-1">เบอร์บ้าน/มือถือ</label>
                            <input type="tel" id="e_hometel" class="w-full px-3 py-2 border border-gray-300 rounded-md text-sm outline-none focus:border-blue-500">
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-gray-500 mb-1">Email</label>
                            <input type="email" id="e_email" class="w-full px-3 py-2 border border-gray-300 rounded-md text-sm outline-none focus:border-blue-500">
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-gray-500 mb-1">Email สำรอง</label>
                            <input type="email" id="e_email2" class="w-full px-3 py-2 border border-gray-300 rounded-md text-sm outline-none focus:border-blue-500">
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-gray-500 mb-1">เฉพาะทาง (board)</label>
                            <input type="text" id="e_board" class="w-full px-3 py-2 border border-gray-300 rounded-md text-sm outline-none focus:border-blue-500">
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-gray-500 mb-1">อนุสาขา (subboard)</label>
                            <input type="text" id="e_subboard" class="w-full px-3 py-2 border border-gray-300 rounded-md text-sm outline-none focus:border-blue-500">
                        </div>
                        <div class="md:col-span-2">
                            <label class="block text-xs font-medium text-gray-500 mb-1">ข้อความส่งถึงสมาคม (note)</label>
                            <!-- เปลี่ยน input เป็น textarea และตั้งค่า rows="4" -->
                            <textarea id="e_note" rows="4" class="w-full px-3 py-2 border border-gray-300 rounded-md text-sm outline-none focus:border-blue-500 transition-colors duration-200"></textarea>
                        </div>
                    </div>

                    <div class="flex gap-3 mt-6 pt-4 border-t">
                        <button type="button" onclick="cancelEdit()" class="w-1/3 bg-gray-200 hover:bg-gray-300 text-gray-700 font-medium py-3 rounded-lg transition">
                            ยกเลิก
                        </button>
                        <button type="submit" class="w-2/3 bg-green-600 hover:bg-green-700 text-white font-medium py-3 rounded-lg transition shadow-md">
                            บันทึกข้อมูล
                        </button>
                    </div>
                </form>
            </div>

            <!-- แจ้งเตือนข้อความ -->
            <div id="alert-box" class="hidden mt-4 p-4 rounded-lg text-sm font-medium text-center"></div>

        </div>
    </div>

    <script>
        // ==========================================
      // ตั้งค่า URL ของ Google Apps Script ที่ Deploy ได้
        const GAS_WEBAPP_URL = "https://script.google.com/macros/s/AKfycbzc3aC26eqiSsaFAXg8tqwRqfWzV7Ysjsq73PEtdZfbXKCMf72naW7uKo3Jw5ryVNI/exec"; 
        
        // ตั้งค่า LIFF ID ของคุณ
        const LIFF_ID = "2009266904-HNFVPDlF"; 
        // ==========================================

        let currentUserRowIndex = null;
        let currentOriginalData = null; // เพิ่มตัวแปรสำหรับเก็บข้อมูลต้นฉบับ
        let lineProfile = { displayName: 'WebUser', userId: 'None' };

        // --- ฟังก์ชันช่วยเหลือ (แก้ปัญหาหัวคอลัมน์ใน Sheet มีตัวพิมพ์เล็ก/ใหญ่ หรือเว้นวรรค) ---
        function getVal(data, key) {
            const normKey = key.toLowerCase().trim();
            for (let k in data) {
                if (k.toLowerCase().trim() === normKey) return data[k] || '';
            }
            return '';
        }

        function getOriginalKey(data, key) {
            const normKey = key.toLowerCase().trim();
            for (let k in data) {
                if (k.toLowerCase().trim() === normKey) return k;
            }
            return key; // กรณีหาไม่เจอ ให้คืนค่า key เดิม
        }

        // โหลดฟังก์ชันเริ่มต้นเมื่อเปิดหน้าเว็บ
        window.onload = function() {
            initializeLiff();
            setupHighlightListeners(); // เรียกฟังก์ชันตรวจสอบการแก้ไขข้อมูล
        };

        // --- ฟังก์ชันดักจับการพิมพ์เพื่อไฮไลท์สีเขียวช่องที่ถูกแก้ไข ---
        function setupHighlightListeners() {
            const fieldsToUpdate = ['name', 'nameeng', 'idmd', 'hn', 'offadd', 'offtel', 'homeadd', 'hometel', 'email', 'email2', 'board', 'subboard', 'note'];
            fieldsToUpdate.forEach(f => {
                const el = document.getElementById(`e_${f}`);
                if(el) {
                    el.addEventListener('input', (e) => {
                        if (!currentOriginalData) return;
                        
                        // เทียบค่าปัจจุบันที่พิมพ์ กับค่าดั้งเดิมจากฐานข้อมูล
                        const originalVal = String(getVal(currentOriginalData, f) || '').trim();
                        const currentVal = String(e.target.value || '').trim();
                        
                        // ถ้าค่าเปลี่ยนไป ให้ใส่สีเขียวอ่อน
                        if (originalVal !== currentVal) {
                            el.classList.add('bg-green-50', 'border-green-500', 'text-green-900');
                            el.classList.remove('border-gray-300');
                        } else {
                            // ถ้าลบกลับมาเหมือนเดิม ให้เอาสีเขียวออก
                            el.classList.remove('bg-green-50', 'border-green-500', 'text-green-900');
                            el.classList.add('border-gray-300');
                        }
                    });
                }
            });
        }

        async function initializeLiff() {
            // ดักจับ Error ไว้ก่อนเลย กรณีที่ยังไม่ได้ตั้งค่า LIFF_ID หรือตั้งเป็นค่าเริ่มต้นไว้
            if (!LIFF_ID || LIFF_ID === "YOUR_LIFF_ID") {
                console.warn("ยังไม่ได้ตั้งค่า LIFF ID ใช้งานผ่านเบราว์เซอร์ปกติ");
                document.getElementById('user-greeting').innerText = "ใช้งานผ่านระบบเว็บ (ไม่เชื่อมต่อ LINE)";
                return;
            }

            try {
                await liff.init({ liffId: LIFF_ID });
                if (liff.isLoggedIn()) {
                    const profile = await liff.getProfile();
                    lineProfile.displayName = profile.displayName;
                    lineProfile.userId = profile.userId;
                    document.getElementById('user-greeting').innerText = `สวัสดีคุณ ${profile.displayName}`;
                } else {
                    document.getElementById('user-greeting').innerText = "กรุณาเปิดลิงก์ผ่านแอป LINE";
                    // liff.login(); // ปลดคอมเมนต์บรรทัดนี้เพื่อบังคับให้ล็อกอิน
                }
            } catch (err) {
                console.error('LIFF Init Error', err);
                document.getElementById('user-greeting').innerText = "ใช้งานผ่านเบราว์เซอร์ปกติ";
            }
        }

        // --- ส่วนจัดการ UI หน้าจอต่างๆ ---
        const loadingScreen = document.getElementById('loading');
        const loadingText = document.getElementById('loading-text');
        const searchSection = document.getElementById('search-section');
        const selectSection = document.getElementById('select-section');
        const editSection = document.getElementById('edit-section');
        const alertBox = document.getElementById('alert-box');

        function showLoading(msg) {
            loadingText.innerText = msg;
            loadingScreen.classList.remove('hidden');
            alertBox.classList.add('hidden');
        }

        function hideLoading() {
            loadingScreen.classList.add('hidden');
        }

        function showAlert(msg, type) {
            alertBox.innerText = msg;
            alertBox.className = `mt-4 p-4 rounded-lg text-sm font-medium text-center ${type === 'error' ? 'bg-red-100 text-red-700' : 'bg-green-100 text-green-700'}`;
            alertBox.classList.remove('hidden');
        }

        function cancelEdit() {
            editSection.classList.add('hidden');
            searchSection.classList.remove('hidden');
            document.getElementById('search-form').reset();
            alertBox.classList.add('hidden');
        }

        function cancelSelect() {
            selectSection.classList.add('hidden');
            searchSection.classList.remove('hidden');
            alertBox.classList.add('hidden');
        }

        // สร้างการ์ดรายชื่อกรณีค้นพบหลายคน
        function showSelectionList(dataArray) {
            searchSection.classList.add('hidden');
            editSection.classList.add('hidden');
            alertBox.classList.add('hidden');
            
            const userListDiv = document.getElementById('user-list');
            userListDiv.innerHTML = '';
            
            dataArray.forEach((user) => {
                // ดึงข้อมูลผ่าน getVal เพื่อป้องกันปัญหาพิมพ์ชื่อคอลัมน์ไม่ตรง
                const fullName = `${getVal(user, 'prename')}${getVal(user, 'fname')} ${getVal(user, 'lname')}`.trim();
                const userCard = document.createElement('div');
                userCard.className = 'p-4 border border-gray-200 rounded-lg hover:bg-blue-50 cursor-pointer flex items-center gap-4 transition shadow-sm bg-white';
                
                // เมื่อคลิกที่รายชื่อ จะทำการส่งข้อมูลไปให้ฟอร์มแก้ไข
                userCard.onclick = () => populateEditForm(user);
                
                const picHtml = user.picUrl 
                    ? `<img src="${user.picUrl}" class="w-12 h-12 rounded-full object-cover border border-gray-200 shrink-0">`
                    : `<div class="w-12 h-12 rounded-full bg-gray-100 flex items-center justify-center text-gray-400 shrink-0"><svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24"><path d="M24 20.993V24H0v-2.996A14.977 14.977 0 0112.004 15c4.904 0 9.26 2.354 11.996 5.993zM16.002 8.999a4 4 0 11-8 0 4 4 0 018 0z" /></svg></div>`;
                
                userCard.innerHTML = `
                    ${picHtml}
                    <div class="overflow-hidden">
                        <div class="font-medium text-gray-800 truncate">${fullName || 'ไม่ระบุชื่อ'}</div>
                        <div class="text-xs text-gray-500 truncate">รุ่น ${getVal(user, 'class') || '-'} | เลข ว. ${getVal(user, 'idmd') || '-'}</div>
                    </div>
                `;
                userListDiv.appendChild(userCard);
            });
            
            selectSection.classList.remove('hidden');
        }

        // --- ฟังก์ชันดึงข้อมูลเติมลงในฟอร์มแก้ไข ---
        function populateEditForm(data) {
            currentUserRowIndex = data.rowIndex;
            currentOriginalData = data; // บันทึกข้อมูลต้นฉบับไว้ใช้อ้างอิงตอนอัปเดต
            
            // แสดงชื่อเต็ม (ดึงผ่าน getVal เพื่อตัดปัญหาคอลัมน์เพี้ยน)
            const fullName = `${getVal(data, 'prename')}${getVal(data, 'fname')} ${getVal(data, 'lname')}`.trim();
            document.getElementById('display-fullname').innerText = fullName;

            // แสดงรูปภาพ
            const imgEl = document.getElementById('profile-img');
            const placeholder = document.getElementById('profile-placeholder');
            if (data.picUrl) {
                imgEl.src = data.picUrl;
                imgEl.classList.remove('hidden');
                placeholder.classList.add('hidden');
            } else {
                imgEl.classList.add('hidden');
                placeholder.classList.remove('hidden');
            }

            // เติมข้อมูลในช่อง Input ให้ครบทุก Field
            const fields = ['name', 'nameeng', 'idmd', 'hn', 'offadd', 'offtel', 'homeadd', 'hometel', 'email', 'email2', 'board', 'subboard', 'note'];
            fields.forEach(f => {
                const el = document.getElementById(`e_${f}`);
                if(el) {
                    el.value = getVal(data, f);
                    // รีเซ็ตไฮไลท์สีกลับเป็นปกติ (เผื่อมีการแก้ไขค้างไว้ก่อนหน้านี้)
                    el.classList.remove('bg-green-50', 'border-green-500', 'text-green-900');
                    el.classList.add('border-gray-300');
                }
            });

            // สลับหน้าจอมาที่หน้าแก้ไข
            searchSection.classList.add('hidden');
            selectSection.classList.add('hidden');
            editSection.classList.remove('hidden');
            alertBox.classList.add('hidden');
        }

        // --- ระบบค้นหาข้อมูล (ส่งไป Apps Script) ---
        document.getElementById('search-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            let classNum = document.getElementById('s_class').value.trim();
            // ตรวจสอบรุ่น: ถ้าเป็นตัวเลขล้วนให้ตัด 0 ด้านหน้า (เช่น 06 -> 6) 
            // แต่ถ้ามีตัวอักษร (เช่น D06, d6) ให้ปรับเป็นตัวพิมพ์ใหญ่
            if (classNum) {
                if (/^\d+$/.test(classNum)) {
                    classNum = parseInt(classNum, 10).toString();
                } else {
                    classNum = classNum.toUpperCase();
                }
            }
            
            const fname = document.getElementById('s_fname').value;
            const lname = document.getElementById('s_lname').value;

            // ตรวจสอบขั้นต่ำ 2 ตัวอักษร
            if(fname.length < 2 || lname.length < 2) {
                showAlert("กรุณาพิมพ์ชื่อและนามสกุลอย่างน้อย 2 ตัวอักษร", "error");
                return;
            }

            showLoading("กำลังค้นหาข้อมูล...");

            try {
                const response = await fetch(GAS_WEBAPP_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({
                        action: 'search',
                        classNum: classNum,
                        fname: fname,
                        lname: lname
                    })
                });
                
                const result = await response.json();
                
                if (result.success && result.data && result.data.length > 0) {
                    if (result.data.length === 1) {
                        // เจอคนเดียว ข้ามไปหน้าแก้ไขเลย
                        populateEditForm(result.data[0]);
                    } else {
                        // เจอหลายคน แสดงหน้ารายชื่อให้เลือกก่อน
                        showSelectionList(result.data);
                    }
                } else {
                    showAlert("ไม่พบข้อมูล หรือระบุข้อมูลไม่ตรงเงื่อนไข", "error");
                }
            } catch (error) {
                console.error(error);
                showAlert("เกิดข้อผิดพลาดในการเชื่อมต่อ หรือคุณยังไม่ได้ใส่ Web App URL", "error");
            } finally {
                hideLoading();
            }
        });

        // --- ระบบอัปเดตข้อมูล (ส่งไป Apps Script) ---
        document.getElementById('update-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            showLoading("กำลังบันทึกข้อมูล...");

            // เก็บค่าที่จะอัปเดต โดยจับคู่กับหัวคอลัมน์ (Key) เดิมเป๊ะๆ กลับไปให้ชีต
            const updateData = {};
            const fieldsToUpdate = ['name', 'nameeng', 'idmd', 'hn', 'offadd', 'offtel', 'homeadd', 'hometel', 'email', 'email2', 'board', 'subboard', 'note'];
            
            fieldsToUpdate.forEach(f => {
                const originalKey = getOriginalKey(currentOriginalData, f);
                updateData[originalKey] = document.getElementById(`e_${f}`).value;
            });

            // ใส่ข้อมูล Line โดยใช้ Key ต้นฉบับ
            updateData[getOriginalKey(currentOriginalData, 'line_displayName')] = lineProfile.displayName;
            updateData[getOriginalKey(currentOriginalData, 'line_uid')] = lineProfile.userId;

            try {
                const response = await fetch(GAS_WEBAPP_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({
                        action: 'update',
                        rowIndex: currentUserRowIndex,
                        data: updateData
                    })
                });
                
                const result = await response.json();
                
                if (result.success) {
                    showAlert("บันทึกข้อมูลเรียบร้อยแล้ว!", "success");
                    // กลับไปหน้าแรกหลังจากผ่านไป 2 วินาที
                    setTimeout(() => cancelEdit(), 2000);
                } else {
                    showAlert("ไม่สามารถบันทึกข้อมูลได้: " + result.message, "error");
                }
            } catch (error) {
                console.error(error);
                showAlert("เกิดข้อผิดพลาดในการเชื่อมต่อเซิร์ฟเวอร์", "error");
            } finally {
                hideLoading();
            }
        });

    </script>
</body>
</html>
